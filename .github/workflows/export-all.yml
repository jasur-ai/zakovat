name: Export full Zakovat question bank

on:
  workflow_dispatch:
  repository_dispatch:
    types: [archive-zakovat]
  schedule:
    - cron: '17 3 * * *'   # daily archive refresh

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/10efd590-zakovat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export all packages
        run: python3 scripts/export_all.py --out-dir data/all

      - name: Commit and push archive
        run: |
          git config user.name "Zakovat Archive Bot"
          git config user.email "archive@users.noreply.github.com"
          git add data/all
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update full Zakovat question bank archive"
          git push origin HEAD:arena/10efd590-zakovat
